# Runs the published image instead of building locally:
#   docker compose -f docker-compose.deploy.yml up -d
# The digest pins the exact image; Renovate opens a PR when a newer image is
# published.
#
services:
  repomonitor:
    image: ghcr.io/clammet/repomonitor:latest@sha256:bac0df719b9c83bc710450e5b8d2daa1c6b3f0d94ce27bee8dded6e6887cefce
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - repomonitor-data:/app/data
    restart: unless-stopped

volumes:
  repomonitor-data:
