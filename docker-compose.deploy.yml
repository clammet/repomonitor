# Runs the published image instead of building locally:
#   docker compose -f docker-compose.deploy.yml up -d
# The digest pins the exact image; Renovate opens a PR when a newer image is
# published.
#
services:
  repomonitor:
    image: ghcr.io/clammet/repomonitor:latest@sha256:38b51308bb616e95c7c2aca009e9624b0c37ac54676d0f11ebe0b599d74ef299
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - repomonitor-data:/app/data
    restart: unless-stopped

volumes:
  repomonitor-data:
