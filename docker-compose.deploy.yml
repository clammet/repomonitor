# Runs the published image instead of building locally:
#   docker compose -f docker-compose.deploy.yml up -d
# The digest pins the exact image; Renovate opens a PR when a newer image is
# published.
#
services:
  repomonitor:
    image: ghcr.io/clammet/repomonitor:latest@sha256:92eb46da62928228c7f4a151d3f7dedf0d7a1aa0d506843f9bd6ea7bf94784f9
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - repomonitor-data:/app/data
    restart: unless-stopped

volumes:
  repomonitor-data:
