# Runs the published image instead of building locally:
#   docker compose -f docker-compose.deploy.yml up -d
# The digest pins the exact image; Renovate opens a PR when a newer image is
# published.
#
services:
  repomonitor:
    image: ghcr.io/clammet/repomonitor:latest@sha256:f1433a21b5d076d846ea5b7b89f388c6dd630abc078567600bcc523dfbc3af6e
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - repomonitor-data:/app/data
    restart: unless-stopped

volumes:
  repomonitor-data:
