# Runs the published image instead of building locally:
#   docker compose -f docker-compose.deploy.yml up -d
# The digest pins the exact image; Renovate opens a PR when a newer image is
# published.
#
services:
  repomonitor:
    image: ghcr.io/clammet/repomonitor:latest@sha256:b56c2ba4a7531c4e3dc3672d35694079945dc1413b53df4a7ca7f0e23cc2d2f3
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - repomonitor-data:/app/data
    restart: unless-stopped

volumes:
  repomonitor-data:
