name: Renovate

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  renovate:
    uses: yuzuyuzuyu/repo-automation/.github/workflows/renovate-runner.yml@c691d5f2b7a126cdbbbe62811329ca24f8b643a9 # v1.0.0
    with:
      app-client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
      native-automerge: true
      # Docker Hub rejects anonymous tag listings beyond 1,000 entries.
      # Limit lookups to 10 pages so Renovate keeps release timestamps
      # instead of falling back to registry data that blocks release-age checks.
      renovate-config: '{"dockerMaxPages":10}'
    secrets:
      RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      RENOVATE_GITHUB_LOOKUP_TOKEN: ${{ secrets.RENOVATE_GITHUB_LOOKUP_TOKEN }}
