name: Renovate

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

env:
  # Exact Renovate engine pin; the action's own default is the floating `44`
  # tag. Renovate bumps it weekly through the customManagers:githubActionsVersions
  # preset in the repo's Renovate config (the annotation must stay on the line
  # directly above the variable).
  # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
  RENOVATE_VERSION: 44.35.4

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    steps:
      # GitHub disables cron triggers after 60 days without repository
      # activity. Re-enabling an active workflow resets that clock, so this
      # keeps every scheduled workflow alive while leaving manually disabled
      # ones alone.
      - name: Keep scheduled workflows alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" \
            --jq '.workflows[] | select(.state == "active" or .state == "disabled_inactivity") | .id' \
          | while read -r id; do
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/enable"
            done

      # Authenticates as a GitHub App (variable RENOVATE_APP_CLIENT_ID and
      # secret RENOVATE_APP_PRIVATE_KEY) so Renovate PRs trigger the CI workflow.
      # The app must be installed on this repository with read/write on
      # contents, pull requests, issues, and workflows (the last one lets
      # Renovate bump action digests in .github/workflows). With no owner or
      # repositories input, the token is scoped to this repository only.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Run Renovate
        uses: renovatebot/github-action@39b914146caeff8cd512e61c8992f1d5913af85c # v46.2.5
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: ${{ env.RENOVATE_VERSION }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          LOG_LEVEL: info
