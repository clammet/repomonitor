name: Renovate

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  renovate:
    uses: yuzuyuzuyu/repo-automation/.github/workflows/renovate-runner.yml@5e43da5687b25e015d70f842804b4aea4c9dc5af # v1.0.25
    with:
      app-client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
      native-automerge: true
    secrets:
      RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      RENOVATE_GITHUB_LOOKUP_TOKEN: ${{ secrets.RENOVATE_GITHUB_LOOKUP_TOKEN }}
