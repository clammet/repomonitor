---
name: Maintenance watchdog

on:
  schedule:
    - cron: "36 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: write

concurrency:
  group: maintenance-watchdog
  cancel-in-progress: false


jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: yuzuyuzuyu/repo-automation/actions/watchdog@bb09d08fd812555f84ba4f39911fa0e412d0e4eb # v1.0.31
